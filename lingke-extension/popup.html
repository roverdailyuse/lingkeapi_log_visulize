<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>灵客API控制面板</title>
    <style>
        body { width: 260px; padding: 15px; font-family: sans-serif; color: #333; margin: 0; }
        h3 { margin-top: 0; font-size: 16px; color: #1890ff; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        p { font-size: 13px; color: #666; line-height: 1.5; }
        .btn { display: block; width: 100%; padding: 8px; margin-top: 10px; background: #1890ff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background: #096dd9; }
    </style>
</head>
<body>
    <h3>💎 灵客API旗舰版插件</h3>
    <p>此插件在灵客API的“使用日志”页面自动生效。</p>
    <p>1. 请前往 <a href="https://lingkeapi.com/console/log" target="_blank" style="color: #1890ff;">控制台日志页</a><br>
       2. 点击页面右下角的 <b>悬浮球</b> 唤醒本地增强分析大屏。<br>
       3. 您的所有抓取记录均使用 IndexedDB 持久化存储在本地，不丢失，不上传。
    </p>
</body>
</html>
